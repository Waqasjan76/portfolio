<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Introduction</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 {
            color: #1e3a8a;
            margin-bottom: 5px;
        }
        h2 {
            color: #4b5563;
            font-size: 1.1rem;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .info-table td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        .label {
            font-weight: bold;
            color: #1e3a8a;
            width: 40%;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>[Your Name]</h1>
        <h2>Software Engineering Student</h2>
        
        <table class="info-table">
            <tr>
                <td class="label">University:</td>
                <td>Abasyn University</td>
            </tr>
            <tr>
                <td class="label">Department:</td>
                <td>Software Engineering</td>
            </tr>
            <tr>
                <td class="label">Semester:</td>
                <td>5th Semester</td>
            </tr>
            <tr>
                <td class="label">Registration ID:</td>
                <td>[Your ID Here]</td>
            </tr>
        </table>
    </div>

</body>
</html>
